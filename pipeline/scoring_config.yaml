# Hackfolio Impact Score Configuration
# Weights redistributed after removing domain_match (was 15%)
# Original weights: organizer_tier=25%, sponsor_recognition=20%, prize_pool=20%, domain_match=15%, participation_scale=10%, recency=10%
# Remaining total: 85% -> redistributed proportionally

weights:
  organizer_tier: 0.2941      # 25/85 ≈ 29.41%
  sponsor_recognition: 0.2353 # 20/85 ≈ 23.53%
  prize_pool: 0.2353          # 20/85 ≈ 23.53%
  participation_scale: 0.1176 # 10/85 ≈ 11.76%
  recency: 0.1176             # 10/85 ≈ 11.76%

# Prize pool scoring thresholds (in USD equivalent)
prize_pool:
  floor_usd: 50000      # Below this = minimal score
  ceiling_usd: 500000   # Above this = max score
  # Non-monetary rewards (Kaggle "Knowledge", "Swag") get a small base score
  non_monetary_base_score: 0.15

# Organizer tier scoring
organizer_tier:
  # Known high-tier organizers (MLH-sanctioned, major platforms, FAANG, etc.)
  high_tier_organizers:
