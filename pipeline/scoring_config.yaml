# Recency scoring
recency:
  # Days before deadline for max score
  active_window_days: 30
  # Days after deadline for min score
  expired_penalty_days: 7
  max_score: 1.0
  min_score: 0.1

# Score tier thresholds
score_tiers:
  top_tier: 75
  solid: 50
  low_priority: 0